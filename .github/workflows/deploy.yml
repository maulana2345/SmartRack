name: Laravel CI/CD

on:
  push:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: SmartRack
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=SmartRack/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=laravel/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=mysql/' .env

      - name: Create Docker network
        run: docker network create shared-network || echo "Network already exists"

      - name: Start Docker Compose
        run: docker compose up -d --build

      - name: Install Composer dependencies
        run: docker compose exec -T app composer install

      - name: Generate key
        run: docker compose exec -T app php artisan key:generate

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Run tests
        run: docker compose exec -T app php artisan test

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    needs: laravel-tests
    runs-on: ubuntu-latest

    steps:
      - name: Pull Docker image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd SmartRack
            git pull
            docker compose up -d --build