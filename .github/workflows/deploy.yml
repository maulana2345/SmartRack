name: Laravel CI/CD

on:
  push:
    branches: [main]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: nama_database_test
          MYSQL_ROOT_PASSWORD: SmartRack2025!
          MYSQL_USER: root
          MYSQL_PASSWORD: SmartRack2025!

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=nama_database_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=SmartRack2025!/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env

      - name: Create Docker network
        run: docker network create shared-network || echo "Network already exists"

      - name: Start Docker Compose
        run: docker compose up -d --build

      - name: Install Composer dependencies
        run: docker compose exec -T app composer install

      - name: Generate key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nama_database_test
          DB_USERNAME: root
          DB_PASSWORD: SmartRack2025!

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nama_database_test
          DB_USERNAME: root
          DB_PASSWORD: SmartRack2025!

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    needs: laravel-tests
    runs-on: ubuntu-latest

    steps:
      - name: Pull Docker image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /var/www/SmartRack
            git pull
            docker-compose up -d --build