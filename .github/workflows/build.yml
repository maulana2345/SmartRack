name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nama_database_test
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3# .github/workflows/build.yml
name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  testing:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nama_database_test
          MYSQL_ROOT_PASSWORD: SmartRack2025!
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=3s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP with required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo, pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip, xml

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies php
        run: |
          composer install --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: |
          npm run build
          cp public/build/.vite/manifest.json public/build

      - name: Copy .env.example to .env
        run: cp .env.example .env
      
      # - name: Wait for MySQL to be ready
      #   run: |
      #     until mysql -h 127.0.0.1 -u root -pElibrary2025! -e "show databases;"; do
      #       echo "Waiting for MySQL to be ready..."
      #       sleep 1
      #     done

      - name: generate key & migrate
        run: |
          php artisan key:generate
          php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nama_database_test
          DB_USERNAME: root
          DB_PASSWORD: SmartRack2025!

      - name: Run Laravel Tests
        run: php artisan test || true
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nama_database_test
          DB_USERNAME: root
          DB_PASSWORD: SmartRack2025!   
  deploy:
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: Pull Docker image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /var/www/SmartRack
            git pull
            docker-compose up -d --build

    steps:
      - uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, pdo_mysql, etc
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy .env.testing
        run: cp .env.testing .env

      - name: Generate key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run tests
        run: php artisan test --env=testing
